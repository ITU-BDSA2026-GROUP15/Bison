name: verfifying

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: '8.0.x'

      - uses: dafny-lang/setup-dafny-action@v1
        with: 
          dafny-version: '4.11.0'
      
      - name: Verfiy Dafny
        run: dafny verify src/Bison.Dafny/Wrapper.dfy

      - name: Generate C# from Dafny
        run: dafny translate cs --include-runtime src/Bison.Dafny/Wrapper.dfy
